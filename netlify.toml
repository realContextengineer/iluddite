[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirect API calls to functions
[[redirects]]
  from = "/api/today"
  to = "/.netlify/functions/get-today-reading"
  status = 200

[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate-daily-reading"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
